; Config the plugin contributes to the project's Engine hierarchy, so a consumer does not have to
; copy anything into their own DefaultEngine.ini to get correct behaviour.

[AssetRegistry]
; Kept so assets saved by an older SDK do not carry these tags into a cooked asset registry: a cook
; save copies existing registry tags forward, so they would otherwise stay resident in a packaged
; build's AssetRegistry.bin for no runtime benefit.
+CookedTagsBlacklist=(Class=*,Tag=CrowdyScan)
+CookedTagsBlacklist=(Class=*,Tag=CrowdyContainerType)
+CookedTagsBlacklist=(Class=*,Tag=CrowdyEffectSurface)
+CookedTagsBlacklist=(Class=*,Tag=CrowdyEffectSurfaceVer)
