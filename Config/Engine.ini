; Config the plugin contributes to the project's Engine hierarchy, so a consumer does not have to
; copy anything into their own DefaultEngine.ini to get correct behaviour.

[AssetRegistry]
; The Game Model schema tags are editor-only: a plan reads them instead of loading packages. A cook
; save copies existing editor registry tags forward, so skipping emission while cooking is not enough
; to keep them out of the shipped registry. Without these entries the payloads stay resident in a
; packaged build's AssetRegistry.bin for no runtime benefit.
+CookedTagsBlacklist=(Class=*,Tag=CrowdyScan)
+CookedTagsBlacklist=(Class=*,Tag=CrowdyContainerType)
+CookedTagsBlacklist=(Class=*,Tag=CrowdyEffectSurface)
+CookedTagsBlacklist=(Class=*,Tag=CrowdyEffectSurfaceVer)
