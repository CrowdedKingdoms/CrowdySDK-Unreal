; Config the plugin contributes to the project's Game hierarchy, so a consuming project does not have
; to copy anything into its own DefaultGame.ini to get correct behaviour.

[/Script/UnrealEd.ProjectPackagingSettings]
; The map profile this plugin ships is reached by path from CrowdyReplication's module startup, never by an
; asset reference, so nothing in a game's content graph points at it and a cook would otherwise leave it
; out. A packaged build without it falls back to no profile at all and the SDK is inactive on every map that
; configured nothing, which is exactly the case the shipped profile exists to cover.
+DirectoriesToAlwaysCook=(Path="/CrowdySDK/Data")
