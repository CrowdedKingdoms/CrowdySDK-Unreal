[CoreRedirects]
; CrowdySDK module split. The SDK used to be one monolithic CrowdySDK module; its
; classes now live in the focused modules CrowdyReplication / CrowdyServices /
; CrowdyVoice / CrowdyNet. Content saved against the old /Script/CrowdySDK.* paths
; is repointed here so it loads in any consuming project without per-project setup.
; This file ships with the plugin; UE reads plugin [CoreRedirects] at startup.

