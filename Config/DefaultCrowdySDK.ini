; Teams and channels used to share one set of group types. They are separate models with separate permission sets
; (only a channel has send_messages), so each now has its own types named for what it holds. Content saved against
; the old shared types is redirected to the TEAM half: both are structurally identical, and every saved reference in
; this project is on a teams path. A channel Blueprint saved against the old types would land on the team type and
; has to be repointed by hand, which is why this is a redirect rather than a rename.
+StructRedirects=(OldName="/Script/CrowdyNet.FCrowdyGroup",NewName="/Script/CrowdyNet.FCrowdyTeam")
+StructRedirects=(OldName="/Script/CrowdyNet.FCrowdyGroupMember",NewName="/Script/CrowdyNet.FCrowdyTeamMember")
+StructRedirects=(OldName="/Script/CrowdyNet.FCrowdyGroupMembership",NewName="/Script/CrowdyNet.FCrowdyTeamMembership")
+StructRedirects=(OldName="/Script/CrowdyNet.FCrowdyGroupRole",NewName="/Script/CrowdyNet.FCrowdyTeamRole")
+StructRedirects=(OldName="/Script/CrowdyNet.FCrowdyRolePermissions",NewName="/Script/CrowdyNet.FCrowdyTeamPermissions")
+StructRedirects=(OldName="/Script/CrowdyNet.FCrowdyAppGroupPolicy",NewName="/Script/CrowdyNet.FCrowdyTeamPolicy")

; The members renamed alongside the types. Without these a redirected struct loads with the field silently at its
; default, which for an id reads as "no team" rather than as an error.
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeam.GroupId",NewName="/Script/CrowdyNet.FCrowdyTeam.TeamId")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamMember.GroupMemberId",NewName="/Script/CrowdyNet.FCrowdyTeamMember.TeamMemberId")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamMember.GroupId",NewName="/Script/CrowdyNet.FCrowdyTeamMember.TeamId")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamMembership.Group",NewName="/Script/CrowdyNet.FCrowdyTeamMembership.Team")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamRole.GroupRoleId",NewName="/Script/CrowdyNet.FCrowdyTeamRole.TeamRoleId")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamRole.GroupId",NewName="/Script/CrowdyNet.FCrowdyTeamRole.TeamId")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamPermissions.bManageGroup",NewName="/Script/CrowdyNet.FCrowdyTeamPermissions.bManageTeam")
+PropertyRedirects=(OldName="/Script/CrowdyNet.FCrowdyTeamPolicy.MaxGroupsPerUser",NewName="/Script/CrowdyNet.FCrowdyTeamPolicy.MaxTeamsPerUser")
+PropertyRedirects=(OldName="/Script/CrowdyServices.FCrowdyTeamsResult.Groups",NewName="/Script/CrowdyServices.FCrowdyTeamsResult.Teams")
+PropertyRedirects=(OldName="/Script/CrowdyServices.FCrowdyChannelsResult.Groups",NewName="/Script/CrowdyServices.FCrowdyChannelsResult.Channels")

; The permission enumerator named for the thing it manages. Its server key is still manage_group.
+EnumRedirects=(OldName="/Script/CrowdyNet.ECrowdyTeamPermission",ValueChanges=(("ECrowdyTeamPermission::ManageGroup","ECrowdyTeamPermission::ManageTeam")))

; The platform collapsed its two GraphQL origins into one, so the setting that named the
; management plane now names the SHARED origin a client asks before it knows anything: which
; datacenter its app lives in, and where to sign in. Renamed for what it is. Without this a
; project's saved value is dropped and the setting silently falls back to its default, which
; for a Custom backend means pointing a build at the wrong server with no error.
+PropertyRedirects=(OldName="/Script/CrowdyReplication.CrowdySDKDeveloperSettings.ManagementApiUrl",NewName="/Script/CrowdyReplication.CrowdySDKDeveloperSettings.DiscoveryUrl")

; -> CrowdyNodes (UK2Node types moved out of the editor module: a UK2Node placed in
; a runtime Blueprint must live in an UncookedOnly / Developer module, so Blueprints
; saved against the old editor-module path are repointed here)
+ClassRedirects=(OldName="/Script/CrowdySDKEditor.CrowdyK2Node_ApplyEffect",NewName="/Script/CrowdyNodes.CrowdyK2Node_ApplyEffect")
+ClassRedirects=(OldName="/Script/CrowdyReplicationUncooked.CrowdyK2Node_ApplyEffect",NewName="/Script/CrowdyNodes.CrowdyK2Node_ApplyEffect")

