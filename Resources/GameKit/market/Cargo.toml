[package]
name = "market"
description = "Vendors that restock, an order book and trades between players, with escrow in each player's own hub (not a ledger)"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ckx-sdk = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
