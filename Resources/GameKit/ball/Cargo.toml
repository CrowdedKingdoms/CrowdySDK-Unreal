[package]
name = "ball"
description = "Starter: a ball game for two teams, a ball the hub moves, possession and goals, the ball shown to nearby players as a realtime actor, and a warden on the positions clients report (world metres, z up)"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ckx-sdk = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
