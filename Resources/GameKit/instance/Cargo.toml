[package]
name = "instance"
description = "Starter: a private run for one party, floors generated from the run's seed, permadeath, an idle expiry, an optional reserved grid volume, and its depth posted to a leaderboard"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ckx-sdk = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
