[package]
name = "arena"
description = "Starter: a real-time arena where the hub referees every hit: classes with abilities (hit-scan, projectiles, area damage, statuses), respawns, kill credit, and a warden on the positions clients report (world metres, z up)"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ckx-sdk = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
