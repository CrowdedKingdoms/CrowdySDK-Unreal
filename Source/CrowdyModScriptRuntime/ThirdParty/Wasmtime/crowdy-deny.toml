[graph]
targets = ["x86_64-pc-windows-msvc"]
no-default-features = true
features = ["cranelift", "pulley", "disable-logging"]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
